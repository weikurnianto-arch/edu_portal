<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edu-Portal Terpadu</title>
    <!-- Font Akademik: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Quill.js Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    
    <!-- CDN SCRIPT -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.3/purify.min.js"></script>
    
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        edu: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' },
                        modern: { bg: '#f4f7f9', card: '#ffffff' }
                    }
                } 
            } 
        }
    </script>
    <style>
        /* EDU PORTAL CSS LOADER */
        #app[v-cloak] {
            display: flex !important; align-items: center; justify-content: center; flex-direction: column;
            background-color: #f4f7f9; position: fixed; inset: 0; z-index: 99999;
        }
        #app[v-cloak] > * { display: none !important; }
        #app[v-cloak]::before {
            content: ''; width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #0f172a;
            border-radius: 50%; animation: e-spin 1s linear infinite; margin-bottom: 20px;
        }
        #app[v-cloak]::after { content: "Memuat Ruang Kerja..."; font-family: 'Inter', sans-serif; font-weight: 700; color: #0f172a; font-size: 13px; }
        @keyframes e-spin { to { transform: rotate(360deg); } }

        /* MODERN CORE STYLES */
        body { background-color: #f4f7f9; color: #334155; -webkit-tap-highlight-color: transparent; margin: 0; overflow: hidden; }

        .edu-card { 
            background: #ffffff; 
            border: 1px solid rgba(226, 232, 240, 0.6); 
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04); 
            border-radius: 1.25rem; 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
        }
        .edu-input { 
            background: #f8fafc; 
            border: 1px solid #e2e8f0; 
            color: #1e293b; 
            border-radius: 0.75rem; 
            transition: all 0.2s; 
            padding: 0.75rem 1.25rem; 
            font-weight: 500;
        }
        .edu-input:focus { 
            background: #ffffff; 
            border-color: #0ea5e9; 
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1); 
            outline: none; 
        }
        
        /* WP STYLE TITLE INPUT */
        .wp-title-input {
            width: 100%; background: transparent; border: none; border-bottom: 2px solid transparent;
            font-size: 2.25rem; font-weight: 800; color: #0f172a; padding: 0.5rem 0; margin-bottom: 0.5rem;
            transition: all 0.2s; line-height: 1.2;
        }
        .wp-title-input::placeholder { color: #cbd5e1; }
        .wp-title-input:focus { outline: none; border-bottom-color: #0ea5e9; }

        .edu-btn { 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 2px 4px 0 rgba(15, 23, 42, 0.02); 
            cursor: pointer; 
            border-radius: 0.75rem; 
            transition: all 0.2s ease; 
            font-weight: 600; 
            padding: 0.5rem 1.25rem; 
        }
        .edu-btn:hover { background: #f8fafc; border-color: #cbd5e1; box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05); }
        .edu-btn-primary { background: #0f172a; color: white; border-color: transparent; box-shadow: 0 4px 10px rgba(15, 23, 42, 0.15); }
        .edu-btn-primary:hover { background: #1e293b; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(15, 23, 42, 0.2); }
        .edu-btn-danger { background: #fee2e2; color: #dc2626; border-color: transparent; }
        .edu-btn-danger:hover { background: #fecaca; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        /* QUILL EDITOR - WP Style Override */
        .ql-toolbar.ql-snow { border: none !important; border-bottom: 1px solid #e2e8f0 !important; background: #f8fafc; border-top-left-radius: 1rem; border-top-right-radius: 1rem; font-family: 'Inter', sans-serif; padding: 0.75rem 1rem; }
        .ql-container.ql-snow { border: none !important; border-bottom-left-radius: 1rem; border-bottom-right-radius: 1rem; font-family: 'Inter', sans-serif; font-size: 1.05rem; background: #ffffff; }
        .ql-editor { min-height: 450px; line-height: 1.8; padding: 1.5rem; color: #334155; }
        .ql-editor p { margin-bottom: 1rem; }
        
        /* TRANSITIONS & SLIDER */
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease, transform 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; transform: translateY(10px); }
        
        .slider-enter-active, .slider-leave-active { transition: opacity 0.8s ease; position: absolute; width: 100%; height: 100%; }
        .slider-enter-from, .slider-leave-to { opacity: 0; }
        
        .dropdown-enter-active, .dropdown-leave-active { transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .dropdown-enter-from, .dropdown-leave-to { opacity: 0; transform: scale(0.95) translateY(-10px); }

        /* MASONRY GALLERY */
        .masonry-grid { columns: 2; column-gap: 1rem; }
        @media (min-width: 768px) { .masonry-grid { columns: 3; } }
        @media (min-width: 1024px) { .masonry-grid { columns: 4; } }
        .masonry-item { break-inside: avoid; margin-bottom: 1rem; }
    </style>
</head>
<body class="font-sans antialiased h-screen overflow-hidden text-slate-700">

    <div id="app" v-cloak class="flex flex-col h-full w-full relative bg-modern-bg">
        
        <!-- TOAST NOTIFICATION -->
        <transition name="dropdown">
            <div v-if="toast.show" class="fixed top-24 left-1/2 -translate-x-1/2 z-[9999] px-5 py-3 rounded-xl edu-card shadow-xl flex items-center gap-3 border" :class="toast.type === 'error' ? 'border-red-200 bg-red-50' : 'border-emerald-200 bg-emerald-50'">
                <i :class="[toast.type === 'error' ? 'ph-warning-circle text-red-500' : 'ph-check-circle text-emerald-500', 'ph-fill text-2xl']"></i>
                <span class="font-bold text-sm" :class="toast.type === 'error' ? 'text-red-800' : 'text-emerald-800'">{{ toast.message }}</span>
            </div>
        </transition>

        <!-- LOGIN SCREEN -->
        <div v-if="!currentUser && route === 'login'" class="w-full h-full flex items-center justify-center absolute inset-0 z-50 bg-slate-50/80 backdrop-blur-sm">
            <div class="edu-card p-10 w-full max-w-sm mx-4 flex flex-col items-center shadow-2xl shadow-slate-200/50 border-white">
                <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-slate-800 to-slate-900 text-white flex items-center justify-center mb-6 shadow-lg shadow-slate-900/20">
                    <img v-if="identitasLembaga.logo" :src="identitasLembaga.logo" class="w-12 h-12 object-contain filter brightness-0 invert">
                    <i v-else class="ph-fill ph-graduation-cap text-4xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-center mb-1 text-slate-900">{{ identitasLembaga.nama || 'Edu-Portal' }}</h1>
                <p class="text-xs text-slate-500 mb-8 uppercase tracking-widest font-bold">Akses Kredensial Internal</p>
                
                <form @submit.prevent="handleLogin" class="space-y-5 w-full">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">ID Pengguna</label>
                        <input v-model="loginForm.username" type="text" required class="w-full edu-input">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Kata Sandi</label>
                        <input v-model="loginForm.password" type="password" required class="w-full edu-input">
                    </div>
                    <button type="submit" :disabled="isActionLoading" class="w-full edu-btn edu-btn-primary py-3.5 text-sm flex justify-center items-center gap-2 mt-4">
                        <i v-if="isActionLoading" class="ph-bold ph-spinner animate-spin text-lg"></i>
                        {{ isActionLoading ? 'Memverifikasi...' : 'Masuk Sekarang' }}
                    </button>
                    <button type="button" @click="navigate('home')" class="w-full mt-4 text-slate-400 text-xs font-bold hover:text-slate-800 transition text-center flex justify-center items-center gap-1">
                        <i class="ph-bold ph-arrow-left"></i> Kembali ke Publik
                    </button>
                </form>
            </div>
        </div>

        <!-- MAIN APP SHELL -->
        <template v-else>
            <div id="main-scroller" class="flex-1 overflow-y-auto w-full relative scroll-smooth bg-[#f4f7f9] flex flex-col">
                
                <!-- MODERN FLOATING HEADER -->
                <div class="sticky top-4 z-[100] px-4 w-full max-w-7xl mx-auto transition-transform duration-300">
                    <header class="bg-white/90 backdrop-blur-xl border border-white/60 shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-2xl px-4 md:px-6 py-3 flex items-center justify-between">
                        
                        <!-- Identitas Kiri -->
                        <div class="flex items-center gap-3 cursor-pointer group" @click="navigate('home')">
                            <div class="w-10 h-10 bg-gradient-to-br from-edu-500 to-edu-700 rounded-xl text-white flex items-center justify-center shadow-md shadow-edu-500/20 group-hover:scale-105 transition-transform">
                                <img v-if="identitasLembaga.logo" :src="identitasLembaga.logo" class="w-6 h-6 object-contain filter brightness-0 invert">
                                <i v-else class="ph-bold ph-graduation-cap text-xl"></i>
                            </div>
                            <div class="hidden lg:block">
                                <h2 class="font-extrabold text-sm text-slate-800 leading-tight tracking-tight">{{ identitasLembaga.nama || 'Edu-Portal' }}</h2>
                                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">{{ identitasLembaga.npsn ? 'NPSN: '+identitasLembaga.npsn : 'Sistem Terpadu' }}</p>
                            </div>
                        </div>

                        <!-- Navigasi Dinamis (Tengah) -->
                        <nav class="hidden md:flex flex-wrap items-center justify-center gap-1 bg-slate-100/60 p-1 rounded-xl border border-slate-200/50 max-w-2xl overflow-hidden">
                            <button v-for="(menu, idx) in appConfig.menus" :key="idx" @click="handleNavClick(menu.url)" class="px-3 lg:px-4 py-2 rounded-lg text-xs font-bold transition-all duration-300 text-slate-600 hover:text-slate-900 hover:bg-white shadow-sm hover:shadow">
                                {{ menu.label }}
                            </button>
                            
                            <template v-if="currentUser">
                                <div class="w-px h-4 bg-slate-300 mx-1"></div>
                                <button @click="navigate('dashboard')" :class="['px-3 lg:px-4 py-2 rounded-lg text-xs font-bold transition-all duration-300', route === 'dashboard' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-200/50']">Dasbor</button>
                                <button @click="navigate('cms')" :class="['px-3 lg:px-4 py-2 rounded-lg text-xs font-bold transition-all duration-300', ['cms', 'cms-editor'].includes(route) ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-200/50']">CMS</button>
                                <button v-if="currentUser.role === 'admin'" @click="navigate('settings')" :class="['px-3 lg:px-4 py-2 rounded-lg text-xs font-bold transition-all duration-300', route === 'settings' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-200/50']"><i class="ph-bold ph-gear"></i></button>
                            </template>
                        </nav>

                        <!-- Aksi / Mobile Toggle (Kanan) -->
                        <div class="flex items-center gap-3">
                            <template v-if="!currentUser">
                                <button @click="navigate('login')" class="hidden md:flex items-center gap-2 px-5 py-2.5 edu-btn-primary rounded-xl text-xs font-bold">
                                    Login Admin <i class="ph-bold ph-sign-in text-sm"></i>
                                </button>
                            </template>
                            <template v-else>
                                <div class="hidden md:flex items-center gap-3 pl-3 border-l border-slate-200">
                                    <button @click="handleLogout" class="w-9 h-9 rounded-full bg-slate-100 text-slate-600 hover:bg-red-50 hover:text-red-600 flex items-center justify-center font-bold transition-colors" title="Keluar">
                                        <i class="ph-bold ph-power text-lg"></i>
                                    </button>
                                </div>
                            </template>
                            
                            <!-- Mobile Menu Button -->
                            <button @click="isMobileMenuOpen = !isMobileMenuOpen" class="md:hidden w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">
                                <i :class="isMobileMenuOpen ? 'ph-bold ph-x text-lg' : 'ph-bold ph-list text-lg'"></i>
                            </button>
                        </div>
                    </header>

                    <!-- Mobile Dropdown Menu -->
                    <transition name="dropdown">
                        <div v-if="isMobileMenuOpen" class="absolute top-[4.5rem] left-4 right-4 bg-white/95 backdrop-blur-xl rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200/50 p-3 md:hidden flex flex-col gap-1 z-50">
                            
                            <!-- Menu Dinamis Mobile -->
                            <div class="px-3 py-1 mb-1 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Navigasi Publik</div>
                            <button v-for="(menu, idx) in appConfig.menus" :key="'mob-'+idx" @click="handleNavClick(menu.url); isMobileMenuOpen=false" class="text-left px-4 py-3 rounded-xl text-sm font-bold transition-all text-slate-600 hover:bg-slate-50">
                                {{ menu.label }}
                            </button>
                            
                            <template v-if="currentUser">
                                <div class="h-px bg-slate-100 my-2 mx-2"></div>
                                <div class="px-4 py-1 mb-1 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Area Internal</div>
                                <button @click="navigate('dashboard'); isMobileMenuOpen=false" :class="['text-left px-4 py-3 rounded-xl text-sm font-bold transition-all', route === 'dashboard' ? 'bg-slate-100 text-slate-900' : 'text-slate-600 hover:bg-slate-50']"><i class="ph-bold ph-squares-four mr-2 text-lg align-text-bottom"></i> Dasbor</button>
                                <button @click="navigate('cms'); isMobileMenuOpen=false" :class="['text-left px-4 py-3 rounded-xl text-sm font-bold transition-all', ['cms','cms-editor'].includes(route) ? 'bg-slate-100 text-slate-900' : 'text-slate-600 hover:bg-slate-50']"><i class="ph-bold ph-article mr-2 text-lg align-text-bottom"></i> Manajemen CPT</button>
                                <button v-if="currentUser.role === 'admin'" @click="navigate('settings'); isMobileMenuOpen=false" :class="['text-left px-4 py-3 rounded-xl text-sm font-bold transition-all', route === 'settings' ? 'bg-slate-100 text-slate-900' : 'text-slate-600 hover:bg-slate-50']"><i class="ph-bold ph-gear mr-2 text-lg align-text-bottom"></i> Setelan Database</button>
                                <div class="h-px bg-slate-100 my-2 mx-2"></div>
                                <button @click="handleLogout" class="text-left px-4 py-3 rounded-xl text-sm font-bold text-red-600 hover:bg-red-50 mt-1"><i class="ph-bold ph-sign-out mr-2 text-lg align-text-bottom"></i> Keluar ({{ currentUser.username }})</button>
                            </template>
                            <template v-else>
                                <button @click="navigate('login'); isMobileMenuOpen=false" class="text-center px-4 py-3.5 mt-2 edu-btn-primary rounded-xl text-sm font-bold"><i class="ph-bold ph-lock-key mr-2 align-text-bottom"></i> Login Administrator</button>
                            </template>
                        </div>
                    </transition>
                </div>

                <!-- MAIN CONTENT AREA -->
                <main class="w-full max-w-7xl mx-auto p-4 md:p-6 mt-4 md:mt-6 flex-1">
                    <transition name="fade" mode="out-in">
                        
                        <!-- ROUTE: HOME (Tampilan Edu-Portal Publik) -->
                        <div v-if="route === 'home'" class="w-full space-y-12 pb-10">
                            
                            <!-- 1. HERO SLIDER SECTION -->
                            <div class="edu-card overflow-hidden relative h-[400px] md:h-[500px] border-0 bg-slate-900 rounded-3xl" @mouseenter="pauseSlider" @mouseleave="startSlider" @touchstart="handleTouchStart" @touchmove="handleTouchMove" @touchend="handleTouchEnd">
                                <transition-group name="slider">
                                    <div v-for="(slide, index) in (sliderItems.length > 0 ? sliderItems : mockSlider)" :key="slide.id || index" v-show="currentSlide === index" class="absolute inset-0 w-full h-full cursor-pointer" @click="slide.redirectUrl ? handleNavClick(slide.redirectUrl) : null">
                                        <div class="absolute inset-0 bg-slate-900/40 mix-blend-multiply z-10"></div>
                                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent z-10"></div>
                                        <img :src="slide.imageUrl" class="w-full h-full object-cover transform scale-105 transition-transform duration-[10000ms] ease-out hover:scale-100" @error="$event.target.src='https://placehold.co/1200x600/0f172a/ffffff?text=Slide+Banner'">
                                        
                                        <div class="absolute bottom-10 left-8 right-8 md:bottom-16 md:left-16 md:right-16 z-20">
                                            <span v-if="slide.category" class="inline-block px-3 py-1 bg-edu-500 text-white text-[10px] font-bold rounded-md uppercase tracking-widest mb-3 shadow-lg">{{ slide.category }}</span>
                                            <h2 class="text-3xl md:text-5xl font-black text-white leading-tight drop-shadow-lg mb-4 max-w-3xl">{{ slide.title }}</h2>
                                            <p v-if="slide.content" class="text-slate-200 text-sm md:text-base max-w-2xl line-clamp-2 drop-shadow-md hidden sm:block" v-html="DOMPurify.sanitize(String(slide.content || '').replace(/<[^>]*>?/gm, ''))"></p>
                                        </div>
                                    </div>
                                </transition-group>
                                
                                <button v-if="(sliderItems.length > 0 ? sliderItems : mockSlider).length > 1" @click.stop="prevSlide" class="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/20 backdrop-blur-md text-white flex items-center justify-center hover:bg-white/40 transition-colors z-30 hidden md:flex"><i class="ph-bold ph-caret-left text-xl"></i></button>
                                <button v-if="(sliderItems.length > 0 ? sliderItems : mockSlider).length > 1" @click.stop="nextSlide" class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/20 backdrop-blur-md text-white flex items-center justify-center hover:bg-white/40 transition-colors z-30 hidden md:flex"><i class="ph-bold ph-caret-right text-xl"></i></button>
                                
                                <div v-if="(sliderItems.length > 0 ? sliderItems : mockSlider).length > 1" class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2 z-30">
                                    <button v-for="(_, idx) in (sliderItems.length > 0 ? sliderItems : mockSlider)" :key="'dot-'+idx" @click.stop="setSlide(idx)" :class="['w-2 h-2 rounded-full transition-all', currentSlide === idx ? 'bg-white w-6' : 'bg-white/50 hover:bg-white/80']"></button>
                                </div>
                            </div>

                            <!-- 2. PROFIL, AGENDA & BERITA UTAMA -->
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div class="lg:col-span-1 space-y-8">
                                    <!-- Profil Kepsek -->
                                    <div v-if="kepsekData && kepsekData.title" class="edu-card p-8 text-center relative overflow-hidden bg-gradient-to-b from-white to-slate-50">
                                        <div class="w-24 h-24 mx-auto mb-5 rounded-full p-1 bg-gradient-to-tr from-edu-500 to-emerald-400">
                                            <img :src="kepsekData.imageUrl || 'https://placehold.co/400x400/e2e8f0/64748b?text=Foto'" class="w-full h-full rounded-full border-4 border-white object-cover">
                                        </div>
                                        <h3 class="font-extrabold text-slate-800 text-lg">{{ kepsekData.title }}</h3>
                                        <p class="text-[10px] text-edu-600 font-bold uppercase tracking-widest mb-4 mt-1">{{ kepsekData.metaDataObj?.jabatan || 'Kepala Lembaga' }}</p>
                                        <div class="text-sm text-slate-600 leading-relaxed italic line-clamp-4 font-medium" v-html="DOMPurify.sanitize(kepsekData.content || '')"></div>
                                        <button @click="openArticle(kepsekData.id)" class="mt-5 text-xs font-bold text-slate-800 border-b-2 border-edu-500 pb-0.5 hover:text-edu-600 transition-colors">Profil Lengkap</button>
                                    </div>

                                    <!-- Agenda -->
                                    <div class="edu-card overflow-hidden">
                                        <div class="bg-slate-50 border-b border-slate-100 p-5 font-extrabold text-slate-800 flex items-center gap-3"><i class="ph-fill ph-calendar-check text-2xl text-edu-500"></i> Agenda Akademik</div>
                                        <div class="divide-y divide-slate-100/80 p-2">
                                            <div v-if="agendaItems.length === 0" class="p-6 text-center text-sm font-medium text-slate-500">Belum ada agenda.</div>
                                            <div v-for="agenda in agendaItems.slice(0,4)" :key="agenda.id" class="p-4 flex gap-4 hover:bg-slate-50 rounded-xl transition-colors cursor-default" @click="openArticle(agenda.id)">
                                                <div class="w-14 h-14 bg-white rounded-xl shadow-sm border border-slate-100 flex flex-col items-center justify-center text-edu-700 flex-shrink-0 cursor-pointer">
                                                    <span class="text-lg font-extrabold leading-none">{{ new Date(agenda.metaDataObj?.tanggalMulai || agenda.date).getDate() || '-' }}</span>
                                                    <span class="text-[9px] font-bold uppercase mt-1 tracking-wider">{{ (agenda.metaDataObj?.tanggalMulai || agenda.date) ? new Date(agenda.metaDataObj?.tanggalMulai || agenda.date).toLocaleString('id-ID', {month:'short'}) : 'Bln' }}</span>
                                                </div>
                                                <div class="flex-1 flex flex-col justify-center cursor-pointer group">
                                                    <h4 class="font-bold text-sm text-slate-800 leading-snug mb-1.5 group-hover:text-edu-600 transition-colors">{{ agenda.title }}</h4>
                                                    <p class="text-xs text-slate-500 font-medium flex items-center gap-1.5"><i class="ph-fill ph-map-pin text-slate-400"></i> {{ agenda.metaDataObj?.lokasi || 'Lingkungan Lembaga' }}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="lg:col-span-2 space-y-6">

                                <div class="space-y-5">
                                    <div v-for="(src, idx) in settingsForm.sources" :key="idx" class="border border-slate-200 rounded-2xl p-5 bg-slate-50/50">
                                        <div class="flex justify-between items-center mb-4">
                                            <h4 class="font-bold text-slate-700 flex items-center gap-2"><i class="ph-fill ph-database text-edu-500 text-lg"></i> {{ src.name }}</h4>
                                            <button type="button" @click="settingsForm.sources.splice(idx, 1)" class="w-8 h-8 rounded-full bg-white border border-slate-200 text-red-500 hover:text-red-700 hover:bg-red-50 flex items-center justify-center transition-colors"><i class="ph-bold ph-trash"></i></button>
                                        </div>
                                        <div class="space-y-2">
                                            <div v-for="(tab, tidx) in (src.tabs||[])" :key="tidx" class="flex flex-col sm:flex-row sm:items-center gap-4 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                                                <label class="flex items-center gap-3 w-full sm:w-1/3">
                                                    <input type="checkbox" v-model="tab.selected" class="w-4 h-4 accent-slate-900 rounded cursor-pointer"> <span class="text-sm font-bold text-slate-700 truncate cursor-pointer">{{ tab.name }}</span>
                                                </label>
                                                <select v-model="tab.visibility" :disabled="!tab.selected" class="edu-input text-xs w-full sm:w-1/4 py-2 font-bold">
                                                    <option value="internal">🔒 Internal</option>
                                                    <option value="public">🌐 Publik</option>
                                                </select>
                                                <input v-model="tab.category" :disabled="!tab.selected" type="text" placeholder="Nama Kategori" class="edu-input text-xs flex-1 py-2 font-bold">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Save Button Float -->
                            <div class="sticky bottom-6 flex justify-end z-20">
                                <button type="button" @click="saveSettings" :disabled="isActionLoading" class="edu-btn edu-btn-primary py-4 px-8 shadow-2xl shadow-slate-900/40 text-sm"><i class="ph-bold ph-floppy-disk mr-2"></i> Simpan Semua Setelan</button>
                            </div>
                        </div>

                    </transition>
                </main>
                
                <!-- MEGA FOOTER (GLOBAL) -->
                <footer v-if="!['login'].includes(route)" class="bg-slate-900 text-slate-300 py-12 px-6 mt-auto border-t-4 border-edu-600">
                    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-10">
                        <div class="col-span-1 md:col-span-2 space-y-4">
                            <div class="flex items-center gap-3 mb-2">
                                <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center p-1">
                                    <img v-if="identitasLembaga.logo" :src="identitasLembaga.logo" class="w-full h-full object-contain">
                                    <i v-else class="ph-bold ph-graduation-cap text-slate-900 text-xl"></i>
                                </div>
                                <h2 class="text-xl font-black text-white">{{ identitasLembaga.nama || 'Edu-Portal' }}</h2>
                            </div>
                            <p class="text-sm font-medium leading-relaxed max-w-md">{{ appConfig.appFooterText || 'Platform Sistem Informasi Manajemen Terpadu.' }}</p>
                            <p class="text-xs text-slate-500 font-bold uppercase tracking-widest mt-4">NPSN: {{ identitasLembaga.npsn || '-' }}</p>
                        </div>
                        
                        <div>
                            <h3 class="text-white font-bold mb-4 uppercase tracking-widest text-xs">Tautan Cepat</h3>
                            <ul class="space-y-2 text-sm font-medium">
                                <li><a @click="navigate('home')" class="hover:text-white cursor-pointer transition-colors">Beranda</a></li>
                                <li><a @click="navigate('viewer')" class="hover:text-white cursor-pointer transition-colors">Pusat Data</a></li>
                                <li v-for="menu in (appConfig.menus || []).slice(0,3)" :key="menu.label"><a @click="handleNavClick(menu.url)" class="hover:text-white cursor-pointer transition-colors">{{ menu.label }}</a></li>
                            </ul>
                        </div>
                        
                        <div>
                            <h3 class="text-white font-bold mb-4 uppercase tracking-widest text-xs">Hubungi Kami</h3>
                            <p class="text-sm font-medium leading-relaxed mb-4 flex items-start gap-2"><i class="ph-fill ph-map-pin mt-1 text-edu-500"></i> {{ identitasLembaga.alamat || 'Alamat belum diatur' }}</p>
                            <div class="flex gap-3">
                                <a href="#" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center hover:bg-edu-600 transition-colors text-white"><i class="ph-bold ph-instagram-logo"></i></a>
                                <a href="#" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center hover:bg-edu-600 transition-colors text-white"><i class="ph-bold ph-youtube-logo"></i></a>
                                <a href="#" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center hover:bg-edu-600 transition-colors text-white"><i class="ph-bold ph-facebook-logo"></i></a>
                            </div>
                        </div>
                    </div>
                    <div class="max-w-7xl mx-auto border-t border-slate-800 mt-10 pt-6 text-center md:text-left flex flex-col md:flex-row justify-between items-center text-xs text-slate-500 font-medium">
                        <p>&copy; {{ new Date().getFullYear() }} {{ identitasLembaga.nama }}. All rights reserved.</p>
                        <p class="mt-2 md:mt-0">Powered by Edu-Portal Enterprise V26.4</p>
                    </div>
                </footer>

            </div>
        </template>
    </div>

    <!-- VUE SCRIPT -->
    <script>
        const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;

        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyy5QjiHpZmQxre8Qh9o84WH0V5TqcTN4xybGke2B8MxFeVInRFZvrhD8lDozOBGmOe/exec'; // MASUKKAN URL WEB APP GAS V21/V26 ANDA DI SINI

        createApp({
            setup() {
                const isGlobalLoading = ref(true);
                const isActionLoading = ref(false);
                const isMobileMenuOpen = ref(false);
                
                const toast = ref({ show: false, message: '', type: 'success' });
                let toastTimer;
                const showToast = (msg, type = 'success') => {
                    toast.value = { show: true, message: msg, type: type };
                    clearTimeout(toastTimer);
                    toastTimer = setTimeout(() => { toast.value.show = false; }, 3000);
                };

                const fetchGasApi = async (action, payload = {}) => {
                    if (!GAS_API_URL) throw new Error("GAS_API_URL belum dikonfigurasi.");
                    const response = await fetch(GAS_API_URL, {
                        method: 'POST', redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action, payload })
                    });
                    return await response.json();
                };
                
                const currentUser = ref(null);
                const route = ref('home');
                
                const appConfig = ref({ appName: 'Edu-Portal', appLogo: '', appFooterText: '', menus: [] });
                const sources = ref([]); 
                const articlesRaw = ref([]);
                
                // PERBAIKAN 1: Computed Articles dengan Safe ID & Automatic Fallback
                const articles = computed(() => articlesRaw.value.map((a, index) => {
                    let parsedMeta = {};
                    try { if(a.metaData) parsedMeta = JSON.parse(a.metaData); } catch(e) {}
                    
                    // Normalisasi ID secara agresif. 
                    // JIKA di Google Sheets tidak ada kolom ID, otomatis gunakan Judul (title) atau Urutan Baris (index) agar tetap bisa diklik.
                    const safeId = a.id || a.ID || a.Id || a.id_artikel || a.id_berita || a.title || `doc-${index}`;
                    
                    return { ...a, id: safeId, metaDataObj: parsedMeta };
                }));

                const activeArticle = ref(null);
                const loginForm = ref({ username: '', password: '' });
                
                // CMS Editor State
                const cmsForm = ref({ type: 'berita', galleryUrls: [] });
                const editorMeta = ref({});
                const cmsFilterType = ref('All');
                const draftSavedAt = ref(null); 
                
                const settingsForm = ref({ sources: [], menus: [], appFooterText: '' });
                const newSourceUrl = ref('');

                // Viewer State
                const viewerForm = ref({ sourceString: '', searchRaw: '', search: '', sortCol: null, sortDir: 'asc', page: 1 });
                const viewerState = ref({ loading: false, headers: [], rows: [] });
                
                let searchTimeout;
                const debounceSearch = () => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => { viewerForm.value.search = viewerForm.value.searchRaw; }, 300);
                };

                // SLIDER LOGIC
                const currentSlide = ref(0);
                let slideInterval = null;
                let touchStartX = 0; let touchEndX = 0;
                
                const mockSlider = [
                    { id:'mock1', title: 'Selamat Datang di Sistem Informasi Terpadu', imageUrl: 'https://placehold.co/1200x600/0f172a/ffffff?text=Slide+Banner+1', content: 'Solusi digital untuk manajemen informasi dan publikasi lembaga.', category: 'Sistem Baru' },
                    { id:'mock2', title: 'Penerimaan Siswa Baru Tahun Ajaran', imageUrl: 'https://placehold.co/1200x600/0284c7/ffffff?text=Slide+Banner+2', content: 'Segera daftarkan putra/putri Anda melalui portal pendaftaran online kami.', category: 'Info PPDB' }
                ];
                
                const nextSlide = () => { const len = sliderItems.value.length > 0 ? sliderItems.value.length : mockSlider.length; currentSlide.value = (currentSlide.value + 1) % len; };
                const prevSlide = () => { const len = sliderItems.value.length > 0 ? sliderItems.value.length : mockSlider.length; currentSlide.value = (currentSlide.value - 1 + len) % len; };
                const setSlide = (idx) => { currentSlide.value = idx; };
                const startSlider = () => { clearInterval(slideInterval); slideInterval = setInterval(nextSlide, 5000); };
                const pauseSlider = () => { clearInterval(slideInterval); };
                const handleTouchStart = (e) => { touchStartX = e.changedTouches[0].screenX; pauseSlider(); };
                const handleTouchMove = (e) => { touchEndX = e.changedTouches[0].screenX; };
                const handleTouchEnd = () => { if (touchStartX - touchEndX > 50) nextSlide(); if (touchEndX - touchStartX > 50) prevSlide(); startSlider(); };

                const parseHash = () => {
                    const hash = window.location.hash.slice(1) || 'home';
                    const [path, qs] = hash.split('?');
                    
                    if (['dashboard', 'cms', 'cms-editor', 'settings'].includes(path) && !currentUser.value) { window.location.hash = '#login'; return; }
                    if (path === 'settings' && currentUser.value?.role !== 'admin') { window.location.hash = '#dashboard'; return; }

                    route.value = path || 'home';
                    const params = new URLSearchParams(qs);
                    
                    if (path === 'article') {
                        const id = params.get('id'); 
                        activeArticle.value = articles.value.find(a => String(a.id).trim() === String(id).trim()) || null;
                    } else if (path === 'viewer') {
                        const src = params.get('src'); const tab = params.get('tab');
                        if (src && tab) { 
                            const str = src + '|||' + tab;
                            if(viewerForm.value.sourceString !== str) {
                                viewerForm.value.sourceString = str;
                                doFetchSheetData(src, tab);
                            }
                        }
                    } else if (path === 'settings') {
                        settingsForm.value.sources = Array.isArray(sources.value) ? JSON.parse(JSON.stringify(sources.value)) : [];
                        
                        // PERBAIKAN 2: Penanganan Strict Array untuk Menu Navigasi
                        let parsedMenus = appConfig.value.menus;
                        if (typeof parsedMenus === 'string') { 
                            try { parsedMenus = JSON.parse(parsedMenus); } catch(e) { parsedMenus = []; } 
                        }
                        if (!Array.isArray(parsedMenus)) { parsedMenus = []; }
                        
                        settingsForm.value.menus = JSON.parse(JSON.stringify(parsedMenus));
                        settingsForm.value.appFooterText = appConfig.value.appFooterText || '';
                    } else if (path === 'cms-editor' && !cmsForm.value.id && !cmsForm.value.type) {
                        openEditor(null); 
                    } else if (path === 'home') {
                        startSlider();
                    }
                    
                    const scroller = document.getElementById('main-scroller');
                    if(scroller) scroller.scrollTop = 0;
                };

                window.addEventListener('hashchange', parseHash);
                const navigate = (path, params = {}) => {
                    const paramsStr = new URLSearchParams(params).toString();
                    window.location.hash = `#${path}${paramsStr ? '?' + paramsStr : ''}`;
                };
                
                const handleNavClick = (url) => {
                    if(!url) return;
                    if(url.startsWith('http')) window.open(url, '_blank');
                    else window.location.hash = url;
                };

                const loadGlobalData = () => {
                    const role = currentUser.value ? currentUser.value.role : null;
                    isGlobalLoading.value = true;
                    if (GAS_API_URL) {
                        fetchGasApi('getInitialPayload', { role }).then(res => {
                            isGlobalLoading.value = false;
                            if(res && res.success) {
                                appConfig.value = res.config || appConfig.value;
                                
                                // Pastikan menus selalu diset minimal jadi array kosong agar sistem Vue tidak macet
                                let cfgMenus = appConfig.value.menus;
                                if(typeof cfgMenus === 'string') {
                                    try { cfgMenus = JSON.parse(cfgMenus); } catch(e) { cfgMenus = []; }
                                }
                                appConfig.value.menus = Array.isArray(cfgMenus) ? cfgMenus : [];
                                
                                sources.value = res.sources || []; 
                                articlesRaw.value = res.articles || [];
                                parseHash();
                            }
                        }).catch(err => { isGlobalLoading.value = false; showToast("Gagal muat data.", "error"); });
                    } else {
                        setTimeout(() => { 
                            isGlobalLoading.value = false; 
                            appConfig.value.menus = [{label: 'Pusat Data', url: '#viewer'}];
                            parseHash(); 
                        }, 1000); 
                    }
                };

                onMounted(() => loadGlobalData());

                const handleLogin = () => {
                    isActionLoading.value = true;
                    if (GAS_API_URL) {
                        fetchGasApi('loginUser', loginForm.value).then(res => {
                            isActionLoading.value = false;
                            if(res.success) { currentUser.value = res.user; navigate('dashboard'); loadGlobalData(); showToast('Login Berhasil'); } 
                            else showToast(res.error, 'error');
                        }).catch(e => { isActionLoading.value = false; showToast('Koneksi Gagal', 'error'); });
                    } else {
                        setTimeout(() => { isActionLoading.value = false; currentUser.value = {username: 'Admin', role: 'admin'}; navigate('dashboard'); }, 500);
                    }
                };
                const handleLogout = () => { currentUser.value = null; isMobileMenuOpen.value = false; navigate('home'); loadGlobalData(); };

                // COMPUTED PROPERTIES UNTUK HOMEPAGE SECTIONS
                const identitasLembaga = computed(() => {
                    const item = articles.value.find(a => a.type === 'identitas_lembaga');
                    return item ? { nama: item.title, logo: item.imageUrl, npsn: item.metaDataObj?.npsn, alamat: item.metaDataObj?.alamat, maps: item.embedCode } : appConfig.value;
                });
                const kepsekData = computed(() => articles.value.find(a => a.type === 'kepala_sekolah') || {});
                const beritaItems = computed(() => articles.value.filter(a => ['berita','pengumuman'].includes(a.type)));
                const agendaItems = computed(() => articles.value.filter(a => a.type === 'agenda'));
                const guruItems = computed(() => articles.value.filter(a => a.type === 'guru_staff'));
                const fasilitasItems = computed(() => articles.value.filter(a => a.type === 'fasilitas'));
                const sliderItems = computed(() => articles.value.filter(a => a.type === 'slider'));
                const videoItems = computed(() => articles.value.filter(a => a.type === 'video'));
                const galeriItems = computed(() => articles.value.filter(a => a.type === 'Galeri'));
                const testimoniItems = computed(() => articles.value.filter(a => a.type === 'testimoni'));
                const prestasiItems = computed(() => articles.value.filter(a => a.type === 'prestasi'));

                const filteredCmsArticles = computed(() => {
                    if(cmsFilterType.value === 'All') return articles.value;
                    return articles.value.filter(a => a.type === cmsFilterType.value);
                });

                let quillInstance = null;
                const setDefaultEditorMeta = () => {
                    if(!cmsForm.value.id) editorMeta.value = {}; 
                };

                const openEditor = (article = null) => {
                    draftSavedAt.value = null;
                    if (article) {
                        editorMeta.value = JSON.parse(JSON.stringify(article.metaDataObj || {}));
                        let parsedUrls = [''];
                        if(article.galleryUrls) { 
                            try { 
                                const arr = JSON.parse(article.galleryUrls); 
                                parsedUrls = Array.isArray(arr) && arr.length > 0 ? arr : ['']; 
                            } catch(e){} 
                        }
                        cmsForm.value = { ...article, galleryUrls: parsedUrls };
                    } else {
                        editorMeta.value = {};
                        cmsForm.value = { id: null, type: 'berita', title: '', content: '', imageUrl: '', category: '', visibility: 'public', author: currentUser.value?.username || 'Admin', date: new Date().toISOString().split('T')[0], tags: '', embedCode: '', redirectUrl: '', galleryUrls: [''] };
                        
                        let draft = localStorage.getItem('edu_draft_content');
                        if (draft && confirm("Ditemukan draf tulisan yang belum disimpan. Ingin memulihkan draf ini?")) {
                            cmsForm.value.content = draft;
                            const now = new Date();
                            draftSavedAt.value = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                        }
                    }
                    navigate('cms-editor');
                    
                    setTimeout(() => {
                        const wrapper = document.getElementById('editor-wrapper');
                        if (wrapper && typeof Quill !== 'undefined') {
                            
                            wrapper.innerHTML = '<div id="quill-editor" class="bg-white"></div>';
                            
                            quillInstance = new Quill('#quill-editor', {
                                theme: 'snow', 
                                placeholder: 'Mulai menulis di area editor konten ini...',
                                modules: { 
                                    toolbar: {
                                        container: [ 
                                            [{ 'header': [1, 2, 3, false] }], 
                                            ['bold', 'italic', 'underline'], 
                                            [{'list': 'ordered'}, {'list': 'bullet'}], 
                                            ['link', 'image'], 
                                            ['clean'] 
                                        ],
                                        handlers: {
                                            image: function() {
                                                var range = this.quill.getSelection();
                                                var value = prompt('Masukkan URL gambar (Misal: dari Google Drive / ImageKit):');
                                                if(value){
                                                    this.quill.insertEmbed(range.index, 'image', value, Quill.sources.USER);
                                                }
                                            }
                                        }
                                    } 
                                }
                            });
                            
                            quillInstance.root.addEventListener('drop', (e) => {
                                if(e.dataTransfer.files && e.dataTransfer.files.length) {
                                    e.preventDefault();
                                    alert('Peringatan: Tarik-lepas (Drag & Drop) file gambar dinonaktifkan! Silakan gunakan ikon Gambar di toolbar untuk memasukkan URL gambar.');
                                }
                            }, false);

                            quillInstance.on('text-change', () => { 
                                cmsForm.value.content = quillInstance.root.innerHTML; 
                                if (!cmsForm.value.id) {
                                    localStorage.setItem('edu_draft_content', cmsForm.value.content);
                                    const now = new Date();
                                    draftSavedAt.value = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                                }
                            });
                            
                            quillInstance.root.innerHTML = cmsForm.value.content || '';
                        }
                    }, 400); 
                };

                const saveCmsArticle = () => {
                    isActionLoading.value = true;
                    if(quillInstance && !['Galeri'].includes(cmsForm.value.type)) {
                        cmsForm.value.content = quillInstance.root.innerHTML;
                        
                        let plainText = quillInstance.getText().trim().replace(/&nbsp;/g, ' ');
                        editorMeta.value.excerpt = plainText.length > 120 ? plainText.substring(0, 120) + '...' : plainText;
                    }
                    
                    const payloadData = JSON.parse(JSON.stringify(cmsForm.value));
                    payloadData.metaData = JSON.stringify(editorMeta.value); 
                    if(Array.isArray(payloadData.galleryUrls)) payloadData.galleryUrls = JSON.stringify(payloadData.galleryUrls.filter(u => u && u.trim()!==''));
                    
                    if(GAS_API_URL) {
                        fetchGasApi('saveArticle', { payloadData }).then(res => {
                            isActionLoading.value = false;
                            if(res.success) { 
                                if(!cmsForm.value.id) localStorage.removeItem('edu_draft_content'); 
                                navigate('cms'); loadGlobalData(); showToast('Tersimpan!'); 
                            }
                            else showToast(res.error, 'error');
                        }).catch(e => { isActionLoading.value = false; showToast('Gagal Simpan', 'error'); });
                    } else {
                        setTimeout(() => { 
                            isActionLoading.value = false; 
                            if(!cmsForm.value.id) localStorage.removeItem('edu_draft_content');
                            navigate('cms'); showToast('Tersimpan (Mock)'); 
                        }, 500);
                    }
                };

                const deleteArticle = (id) => {
                    if(confirm("Hapus data ini?") && GAS_API_URL) {
                        fetchGasApi('deleteArticle', { id }).then(res => { if(res.success) loadGlobalData(); });
                    }
                };

                // VIEWER LOGIC
                const doFetchSheetData = (srcId, tabName) => {
                    viewerState.value.loading = true; viewerForm.value.searchRaw = ''; viewerForm.value.search = ''; viewerForm.value.page = 1;
                    if (GAS_API_URL) {
                        fetchGasApi('getSheetData', { srcId, tabName }).then(res => {
                            viewerState.value.loading = false;
                            if(res.success) { viewerState.value.headers = res.headers||[]; viewerState.value.rows = res.rows||[]; }
                        }).catch(e => viewerState.value.loading = false);
                    }
                };
                const handleViewerDropdownChange = () => {
                    const parts = viewerForm.value.sourceString.split('|||');
                    if(parts.length === 2) { navigate('viewer', {src: parts[0], tab: parts[1]}); doFetchSheetData(parts[0], parts[1]); }
                };

                const viewerFiltered = computed(() => {
                    let result = viewerState.value.rows || [];
                    const q = viewerForm.value.search.toLowerCase();
                    if (q) result = result.filter(r => r.some(c => String(c).toLowerCase().includes(q)));
                    if (viewerForm.value.sortCol !== null) {
                        const col = viewerForm.value.sortCol; const dir = viewerForm.value.sortDir;
                        result = result.slice().sort((a,b) => dir==='asc'? String(a[col]).localeCompare(String(b[col])) : String(b[col]).localeCompare(String(a[col])));
                    }
                    return result;
                });
                const viewerPaginated = computed(() => { const start = (viewerForm.value.page - 1) * 50; return viewerFiltered.value.slice(start, start + 50); });
                const viewerTotalPages = computed(() => Math.ceil(viewerFiltered.value.length / 50));
                watch(() => viewerForm.value.search, () => viewerForm.value.page = 1);
                const viewerSort = (i) => { if(viewerForm.value.sortCol===i) viewerForm.value.sortDir=viewerForm.value.sortDir==='asc'?'desc':'asc'; else{ viewerForm.value.sortCol=i; viewerForm.value.sortDir='asc'; }};

                const openArticle = (id) => navigate('article', {id});
                
                const getParsedGallery = (item) => { 
                    try { 
                        const arr = Array.isArray(JSON.parse(item.galleryUrls)) ? JSON.parse(item.galleryUrls) : [];
                        return arr.filter(u => u && u.trim() !== ''); 
                    } catch(e) { return []; } 
                };
                const getGalleryCover = (item) => getParsedGallery(item)[0] || item.imageUrl || '';

                // SETTINGS LOGIC 
                const saveSettings = () => {
                    isActionLoading.value = true;
                    
                    // PERBAIKAN 3: Aman saat filter menu Array
                    let currentMenus = settingsForm.value.menus;
                    if (!Array.isArray(currentMenus)) { currentMenus = []; }
                    const validMenus = currentMenus.filter(m => m && m.label && String(m.label).trim() !== '');
                    
                    if(GAS_API_URL) {
                        const payloadConfig = { 
                            sources: settingsForm.value.sources, 
                            menus: JSON.stringify(validMenus),
                            appFooterText: settingsForm.value.appFooterText
                        };
                        fetchGasApi('saveAppConfig', { payloadData: payloadConfig }).then(res => {
                            isActionLoading.value = false;
                            if(res.success) { loadGlobalData(); showToast('Konfigurasi Tersimpan'); }
                            else { showToast('Gagal: ' + (res.error || 'Terjadi kesalahan sistem'), 'error'); }
                        }).catch(e => {
                            isActionLoading.value = false; 
                            showToast('Gagal terhubung ke database', 'error');
                        });
                    } else {
                        setTimeout(() => { 
                            isActionLoading.value = false; 
                            appConfig.value.menus = JSON.parse(JSON.stringify(validMenus));
                            appConfig.value.appFooterText = settingsForm.value.appFooterText;
                            showToast('Simpan Lokal Berhasil (UI Diperbarui)'); 
                        }, 500);
                    }
                };
                
                const verifySourceUrl = () => {
                    if(!newSourceUrl.value) return;
                    isActionLoading.value = true;
                    if(GAS_API_URL) {
                        fetchGasApi('fetchTabsFromUrl', { url: newSourceUrl.value }).then(res => {
                            isActionLoading.value = false;
                            if(res.success) { settingsForm.value.sources.push(res); newSourceUrl.value = ''; showToast('Sheet Ditambahkan'); }
                            else showToast(res.error, 'error');
                        });
                    }
                };

                return {
                    isGlobalLoading, isActionLoading, isMobileMenuOpen, currentUser, route, navigate, handleNavClick, toast,
                    articles, identitasLembaga, kepsekData, beritaItems, agendaItems, guruItems, fasilitasItems, sliderItems, videoItems, galeriItems, testimoniItems, prestasiItems, mockSlider,
                    filteredCmsArticles, cmsFilterType, cmsForm, editorMeta, openEditor, setDefaultEditorMeta, saveCmsArticle, deleteArticle, openArticle, getParsedGallery, getGalleryCover,
                    loginForm, handleLogin, handleLogout, draftSavedAt, DOMPurify,
                    sources, viewerForm, viewerState, viewerPaginated, viewerFiltered, viewerTotalPages, viewerSort, debounceSearch, handleViewerDropdownChange,
                    settingsForm, newSourceUrl, saveSettings, verifySourceUrl,
                    currentSlide, nextSlide, prevSlide, setSlide, pauseSlider, startSlider, handleTouchStart, handleTouchMove, handleTouchEnd, appConfig
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
