<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edu-Portal Terpadu</title>
    <!-- Font Akademik: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Quill.js Rich Text Editor CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <!-- CDN SCRIPT -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js" defer></script>
    
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        edu: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' }
                    }
                } 
            } 
        }
    </script>
    <style>
        /* EDU PORTAL CSS LOADER */
        #app[v-cloak] {
            display: flex !important; align-items: center; justify-content: center; flex-direction: column;
            background-color: #f8fafc; position: fixed; inset: 0; z-index: 99999;
        }
        #app[v-cloak] > * { display: none !important; }
        #app[v-cloak]::before {
            content: ''; width: 40px; height: 40px; border: 4px solid #e0f2fe; border-top-color: #0284c7;
            border-radius: 50%; animation: e-spin 1s linear infinite; margin-bottom: 20px;
        }
        #app[v-cloak]::after { content: "Memuat Edu-Portal..."; font-family: 'Inter', sans-serif; font-weight: 700; color: #0c4a6e; font-size: 13px; }
        @keyframes e-spin { to { transform: rotate(360deg); } }

        /* CORE STYLES */
        body { background-color: #f1f5f9; color: #334155; -webkit-tap-highlight-color: transparent; margin: 0; overflow: hidden; }

        .edu-card { background: #ffffff; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); border: 1px solid #e2e8f0; border-radius: 1rem; }
        .edu-input { background: #f8fafc; border: 1px solid #cbd5e1; color: #1e293b; border-radius: 0.5rem; transition: all 0.2s; padding: 0.75rem 1rem; }
        .edu-input:focus { background: #ffffff; border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15); outline: none; }
        .edu-btn { background: #ffffff; border: 1px solid #cbd5e1; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); cursor: pointer; border-radius: 0.5rem; transition: all 0.2s; font-weight: 600; padding: 0.5rem 1rem; }
        .edu-btn:hover { background: #f8fafc; border-color: #94a3b8; }
        .edu-btn-primary { background: #0284c7; color: white; border-color: transparent; }
        .edu-btn-primary:hover { background: #0369a1; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* QUILL EDITOR OVERRIDES FULL PAGE */
        .ql-toolbar.ql-snow { border: 1px solid #cbd5e1 !important; border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; background: #f8fafc; font-family: 'Inter', sans-serif; }
        .ql-container.ql-snow { border: 1px solid #cbd5e1 !important; border-bottom-left-radius: 0.5rem; border-bottom-right-radius: 0.5rem; border-top: none !important; font-family: 'Inter', sans-serif; font-size: 1rem; background: #ffffff; }
        .ql-editor { min-height: 400px; line-height: 1.7; }
        
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
    </style>
</head>
<body class="font-sans antialiased h-screen overflow-hidden text-slate-700">

    <div id="app" v-cloak class="flex h-full w-full relative">
        
        <!-- TOAST NOTIFICATION -->
        <transition name="fade">
            <div v-if="toast.show" class="fixed top-4 right-4 z-[9999] px-4 py-3 rounded-lg edu-card shadow-xl flex items-center gap-3 border-l-4" :class="toast.type === 'error' ? 'border-l-red-500' : 'border-l-emerald-500'">
                <i :class="[toast.type === 'error' ? 'ph-warning-circle text-red-500' : 'ph-check-circle text-emerald-500', 'ph-fill text-xl']"></i>
                <span class="font-semibold text-sm">{{ toast.message }}</span>
            </div>
        </transition>

        <!-- LOGIN SCREEN -->
        <div v-if="!currentUser && route === 'login'" class="w-full h-full flex items-center justify-center absolute inset-0 z-50 bg-slate-100">
            <div class="edu-card p-8 w-full max-w-sm mx-4 flex flex-col items-center">
                <div class="w-16 h-16 rounded-full bg-edu-100 text-edu-600 flex items-center justify-center mb-4">
                    <img v-if="identitasLembaga.logo" :src="identitasLembaga.logo" class="w-10 h-10 object-contain">
                    <i v-else class="ph-fill ph-graduation-cap text-4xl"></i>
                </div>
                <h1 class="text-xl font-bold text-center mb-1">{{ identitasLembaga.nama || 'Edu-Portal' }}</h1>
                <p class="text-xs text-slate-500 mb-6 uppercase tracking-wider font-semibold">Login Administrator</p>
                <form @submit.prevent="handleLogin" class="space-y-4 w-full">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ID Pengguna</label>
                        <input v-model="loginForm.username" type="text" required class="w-full edu-input">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Kata Sandi</label>
                        <input v-model="loginForm.password" type="password" required class="w-full edu-input">
                    </div>
                    <button type="submit" :disabled="isActionLoading" class="w-full edu-btn edu-btn-primary flex justify-center items-center gap-2 mt-2">
                        <i v-if="isActionLoading" class="ph-bold ph-spinner animate-spin"></i>
                        {{ isActionLoading ? 'Memverifikasi...' : 'Masuk Sistem' }}
                    </button>
                    <button type="button" @click="navigate('home')" class="w-full mt-2 text-slate-500 text-xs hover:text-edu-600 transition text-center">Kembali ke Web Publik</button>
                </form>
            </div>
        </div>

        <!-- MAIN APP SHELL -->
        <template v-else>
            <!-- SIDEBAR -->
            <div v-if="isMobileMenuOpen" @click="isMobileMenuOpen = false" class="fixed inset-0 bg-slate-900/50 z-[60] md:hidden"></div>

            <aside :class="['fixed inset-y-0 left-0 z-[70] w-64 bg-white border-r border-slate-200 flex flex-col transition-transform duration-300 md:relative md:translate-x-0', isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full']">
                <div class="p-5 flex items-center gap-3 border-b border-slate-100">
                    <div class="w-8 h-8 bg-edu-100 rounded text-edu-600 flex items-center justify-center">
                        <i class="ph-bold ph-graduation-cap text-xl"></i>
                    </div>
                    <div class="overflow-hidden">
                        <h2 class="font-bold text-sm text-slate-800 truncate">{{ identitasLembaga.nama || 'Edu-Portal' }}</h2>
                        <p class="text-[10px] text-slate-500 truncate">{{ identitasLembaga.npsn ? 'NPSN: '+identitasLembaga.npsn : 'Sistem Terpadu' }}</p>
                    </div>
                    <button @click="isMobileMenuOpen = false" class="ml-auto text-slate-400 md:hidden"><i class="ph-bold ph-x text-lg"></i></button>
                </div>

                <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 mt-2 px-3">Halaman Publik</div>
                    <button @click="navigate('home'); isMobileMenuOpen=false;" :class="['w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors', route === 'home' ? 'bg-edu-50 text-edu-700' : 'text-slate-600 hover:bg-slate-50']">
                        <i class="ph-fill ph-house text-lg"></i> Beranda Web
                    </button>
                    <button @click="navigate('viewer'); isMobileMenuOpen=false;" :class="['w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors', route === 'viewer' ? 'bg-edu-50 text-edu-700' : 'text-slate-600 hover:bg-slate-50']">
                        <i class="ph-fill ph-table text-lg"></i> Pusat Data
                    </button>

                    <template v-if="currentUser">
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 mt-6 px-3">Area Internal</div>
                        <button @click="navigate('dashboard'); isMobileMenuOpen=false;" :class="['w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors', route === 'dashboard' ? 'bg-edu-50 text-edu-700' : 'text-slate-600 hover:bg-slate-50']">
                            <i class="ph-fill ph-squares-four text-lg"></i> Dasbor Admin
                        </button>
                        <button @click="navigate('cms'); isMobileMenuOpen=false;" :class="['w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors', ['cms', 'cms-editor'].includes(route) ? 'bg-edu-50 text-edu-700' : 'text-slate-600 hover:bg-slate-50']">
                            <i class="ph-fill ph-article text-lg"></i> Kelola Konten & CPT
                        </button>
                        <button v-if="currentUser.role === 'admin'" @click="navigate('settings'); isMobileMenuOpen=false;" :class="['w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors', route === 'settings' ? 'bg-edu-50 text-edu-700' : 'text-slate-600 hover:bg-slate-50']">
                            <i class="ph-fill ph-gear text-lg"></i> Setelan Database
                        </button>
                    </template>
                </nav>

                <div class="p-4 border-t border-slate-100">
                    <button v-if="!currentUser" @click="navigate('login'); isMobileMenuOpen=false;" class="w-full edu-btn flex items-center justify-center gap-2 text-edu-600">
                        <i class="ph-bold ph-sign-in"></i> Login Admin
                    </button>
                    <div v-else class="flex items-center justify-between px-2">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-600 font-bold text-xs">{{ currentUser.username.charAt(0).toUpperCase() }}</div>
                            <div class="text-xs">
                                <p class="font-bold text-slate-700">{{ currentUser.username }}</p>
                                <p class="text-[10px] text-slate-500 uppercase">{{ currentUser.role }}</p>
                            </div>
                        </div>
                        <button @click="handleLogout" class="text-slate-400 hover:text-red-500"><i class="ph-bold ph-sign-out text-lg"></i></button>
                    </div>
                </div>
            </aside>

            <!-- MAIN CONTENT AREA -->
            <main id="main-scroller" class="flex-1 overflow-y-auto bg-slate-50 flex flex-col relative w-full h-full">
                
                <!-- MOBILE HEADER -->
                <header class="md:hidden bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-40">
                    <div class="flex items-center gap-2 font-bold text-edu-700">
                        <i class="ph-fill ph-graduation-cap text-xl"></i> Edu-Portal
                    </div>
                    <button @click="isMobileMenuOpen = true" class="text-slate-600"><i class="ph-bold ph-list text-2xl"></i></button>
                </header>

                <div class="flex-1 w-full p-4 md:p-8">
                    <transition name="fade" mode="out-in">
                        
                        <!-- ROUTE: HOME (Tampilan Edu-Portal Publik) -->
                        <div v-if="route === 'home'" class="max-w-6xl mx-auto space-y-8">
                            <!-- Hero / Identitas -->
                            <div class="edu-card bg-gradient-to-r from-edu-900 to-edu-700 text-white overflow-hidden relative">
                                <!-- Background Image (ambil dari salah satu fasilitas jika ada) -->
                                <img v-if="fasilitasItems.length > 0" :src="fasilitasItems[0].imageUrl || getGalleryCover(fasilitasItems[0])" class="absolute inset-0 w-full h-full object-cover opacity-20 mix-blend-overlay">
                                
                                <div class="relative z-10 p-8 md:p-12 flex flex-col md:flex-row items-center md:items-start gap-6">
                                    <div class="w-24 h-24 md:w-32 md:h-32 bg-white rounded-2xl p-2 shadow-lg flex-shrink-0">
                                        <img v-if="identitasLembaga.logo" :src="identitasLembaga.logo" class="w-full h-full object-contain">
                                        <div v-else class="w-full h-full bg-slate-100 rounded-xl flex items-center justify-center text-edu-300"><i class="ph-fill ph-buildings text-5xl"></i></div>
                                    </div>
                                    <div class="text-center md:text-left flex-1">
                                        <span v-if="identitasLembaga.npsn" class="inline-block px-3 py-1 bg-white/20 rounded-full text-xs font-bold tracking-wider mb-3">NPSN: {{ identitasLembaga.npsn }}</span>
                                        <h1 class="text-3xl md:text-5xl font-extrabold mb-3 leading-tight">{{ identitasLembaga.nama || 'Sistem Informasi Lembaga' }}</h1>
                                        <p class="text-edu-100 flex items-center justify-center md:justify-start gap-2 text-sm max-w-2xl"><i class="ph-fill ph-map-pin"></i> {{ identitasLembaga.alamat || 'Alamat lembaga belum diatur.' }}</p>
                                    </div>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <!-- Kolom Kiri: Sambutan & Pengumuman -->
                                <div class="lg:col-span-1 space-y-8">
                                    <!-- Profil Kepsek -->
                                    <div v-if="kepsekData.title" class="edu-card p-6 text-center relative overflow-hidden">
                                        <div class="h-20 bg-edu-100 absolute top-0 left-0 right-0"></div>
                                        <img :src="kepsekData.imageUrl || 'https://placehold.co/400x400/e2e8f0/64748b?text=Foto'" class="w-24 h-24 rounded-full border-4 border-white shadow-md mx-auto relative z-10 object-cover mt-4 mb-4">
                                        <h3 class="font-bold text-slate-800 text-lg">{{ kepsekData.title }}</h3>
                                        <p class="text-xs text-edu-600 font-bold uppercase mb-4">{{ kepsekData.metaDataObj?.jabatan || 'Kepala Lembaga' }}</p>
                                        <div class="text-sm text-slate-600 italic line-clamp-4" v-html="kepsekData.content"></div>
                                        <button @click="openArticle(kepsekData.id)" class="mt-4 text-xs font-bold text-edu-600 hover:underline">Baca Selengkapnya</button>
                                    </div>

                                    <!-- Agenda -->
                                    <div class="edu-card p-0 overflow-hidden">
                                        <div class="bg-slate-800 text-white p-4 font-bold flex items-center gap-2"><i class="ph-bold ph-calendar"></i> Agenda Akademik</div>
                                        <div class="divide-y divide-slate-100">
                                            <div v-if="agendaItems.length === 0" class="p-4 text-center text-sm text-slate-500">Belum ada agenda.</div>
                                            <div v-for="agenda in agendaItems.slice(0,4)" :key="agenda.id" class="p-4 flex gap-4">
                                                <div class="w-12 h-12 bg-edu-50 rounded-lg flex flex-col items-center justify-center text-edu-700 flex-shrink-0 border border-edu-100">
                                                    <span class="text-xs font-bold">{{ new Date(agenda.metaDataObj?.tanggalMulai || agenda.date).getDate() }}</span>
                                                    <span class="text-[10px] uppercase">{{ new Date(agenda.metaDataObj?.tanggalMulai || agenda.date).toLocaleString('id-ID', {month:'short'}) }}</span>
                                                </div>
                                                <div>
                                                    <h4 class="font-bold text-sm text-slate-800 leading-tight mb-1">{{ agenda.title }}</h4>
                                                    <p class="text-xs text-slate-500"><i class="ph-fill ph-map-pin"></i> {{ agenda.metaDataObj?.lokasi || 'Lingkungan Lembaga' }}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Kolom Kanan: Berita Utama -->
                                <div class="lg:col-span-2 space-y-6">
                                    <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                                        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2"><i class="ph-fill ph-newspaper text-edu-600"></i> Berita Terkini</h2>
                                        <span class="text-xs font-bold text-edu-600 cursor-pointer">Lihat Semua</span>
                                    </div>
                                    
                                    <div v-if="beritaItems.length === 0" class="edu-card p-10 text-center text-slate-500">Belum ada berita yang dipublikasikan.</div>
                                    
                                    <div v-else class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                        <div v-for="berita in beritaItems.slice(0,4)" :key="berita.id" class="edu-card overflow-hidden group cursor-pointer hover:shadow-md transition-shadow" @click="openArticle(berita.id)">
                                            <div class="h-48 bg-slate-200 overflow-hidden relative">
                                                <img :src="berita.imageUrl || 'https://placehold.co/600x400/f1f5f9/94a3b8?text=Berita'" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                                <span class="absolute top-3 left-3 bg-white/90 backdrop-blur text-edu-700 text-[10px] font-bold px-2 py-1 rounded uppercase shadow-sm">{{ berita.category || 'Umum' }}</span>
                                            </div>
                                            <div class="p-4">
                                                <p class="text-[10px] text-slate-500 font-bold mb-2">{{ berita.date }}</p>
                                                <h3 class="font-bold text-slate-800 leading-snug line-clamp-2 mb-2 group-hover:text-edu-600">{{ berita.title }}</h3>
                                                <p class="text-xs text-slate-600 line-clamp-2">{{ String(berita.content).replace(/<[^>]*>?/gm, '') }}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Direktori Guru Preview -->
                                    <div v-if="guruItems.length > 0" class="pt-4 border-t border-slate-200">
                                        <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="ph-fill ph-users text-edu-600"></i> Direktori Pengajar</h3>
                                        <div class="flex overflow-x-auto gap-4 pb-4 scrollbar-hide">
                                            <div v-for="guru in guruItems.slice(0,5)" :key="guru.id" class="w-32 flex-shrink-0 text-center cursor-pointer" @click="openArticle(guru.id)">
                                                <img :src="guru.imageUrl || 'https://placehold.co/200x200/e2e8f0/64748b?text=Guru'" class="w-20 h-20 rounded-full mx-auto object-cover mb-2 border border-slate-200 shadow-sm">
                                                <h4 class="font-bold text-xs text-slate-800 line-clamp-1">{{ guru.title }}</h4>
                                                <p class="text-[10px] text-slate-500 line-clamp-1">{{ guru.metaDataObj?.mapel || guru.category || 'Pengajar' }}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ROUTE: ARTICLE READ VIEW -->
                        <div v-else-if="route === 'article'" class="max-w-4xl mx-auto">
                            <div v-if="activeArticle" class="edu-card p-6 md:p-10">
                                <button @click="navigate('home')" class="text-sm font-semibold text-slate-500 hover:text-edu-600 flex items-center gap-1 mb-6"><i class="ph-bold ph-arrow-left"></i> Kembali</button>
                                
                                <div class="flex flex-wrap gap-2 mb-4">
                                    <span class="px-2.5 py-1 bg-edu-50 text-edu-700 text-xs font-bold rounded uppercase">{{ activeArticle.type }}</span>
                                    <span v-if="activeArticle.category" class="px-2.5 py-1 bg-slate-100 text-slate-600 text-xs font-bold rounded uppercase">{{ activeArticle.category }}</span>
                                    <span class="px-2.5 py-1 text-slate-500 text-xs font-medium flex items-center gap-1"><i class="ph-bold ph-calendar-blank"></i> {{ activeArticle.date }}</span>
                                </div>

                                <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-6">{{ activeArticle.title }}</h1>
                                
                                <img v-if="activeArticle.imageUrl && activeArticle.type !== 'Galeri'" :src="activeArticle.imageUrl" class="w-full rounded-xl mb-8 object-cover max-h-[400px]">

                                <!-- Format khusus untuk Guru -->
                                <div v-if="activeArticle.type === 'guru_staff'" class="bg-slate-50 p-4 rounded-lg border border-slate-200 mb-6 flex flex-wrap gap-4">
                                    <div v-if="activeArticle.metaDataObj?.nik" class="flex-1 min-w-[150px]">
                                        <p class="text-[10px] uppercase text-slate-500 font-bold">NIP / NIK</p>
                                        <p class="font-semibold text-slate-800">{{ activeArticle.metaDataObj.nik }}</p>
                                    </div>
                                    <div v-if="activeArticle.metaDataObj?.jabatan" class="flex-1 min-w-[150px]">
                                        <p class="text-[10px] uppercase text-slate-500 font-bold">Jabatan</p>
                                        <p class="font-semibold text-slate-800">{{ activeArticle.metaDataObj.jabatan }}</p>
                                    </div>
                                    <div v-if="activeArticle.metaDataObj?.mapel" class="flex-1 min-w-[150px]">
                                        <p class="text-[10px] uppercase text-slate-500 font-bold">Mata Pelajaran</p>
                                        <p class="font-semibold text-slate-800">{{ activeArticle.metaDataObj.mapel }}</p>
                                    </div>
                                </div>

                                <!-- Galeri Custom Display -->
                                <div v-if="activeArticle.type === 'Galeri' && getParsedGallery(activeArticle).length > 0" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                                    <img v-for="(img, i) in getParsedGallery(activeArticle)" :key="i" :src="img" class="w-full h-48 object-cover rounded-lg border border-slate-200">
                                </div>

                                <div class="ql-editor p-0" v-html="activeArticle.content"></div>
                            </div>
                        </div>

                        <!-- ROUTE: VIEWER (DIPERTAHANKAN DENGAN OPTIMASI) -->
                        <div v-else-if="route === 'viewer'" class="max-w-7xl mx-auto h-[calc(100vh-8rem)] flex flex-col gap-4">
                            <div class="edu-card p-4 flex flex-col sm:flex-row gap-4 items-center bg-white shadow-sm shrink-0">
                                <div class="w-full sm:w-1/3">
                                    <select v-model="viewerForm.sourceString" @change="handleViewerDropdownChange" class="w-full edu-input text-sm font-semibold cursor-pointer">
                                        <option value="" disabled>-- Pilih Dokumen Data --</option>
                                        <optgroup v-for="source in sources" :key="source.id" :label="source.name">
                                            <option v-for="tab in (source.tabs||[])" :key="tab.name" :value="source.id + '|||' + tab.name">{{ tab.name }} ({{ tab.category || 'Data' }})</option>
                                        </optgroup>
                                    </select>
                                </div>
                                <div class="w-full sm:flex-1 relative">
                                    <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                    <!-- Menerapkan v-model dengan modifier untuk debounce manual di script -->

                                        </div>

                                            <div v-for="(tab, tidx) in (src.tabs||[])" :key="tidx" class="flex items-center gap-4 bg-white p-2 rounded border border-slate-100">

                                                </label>
                                                <select v-model="tab.visibility" :disabled="!tab.selected" class="edu-input text-xs w-1/4 py-1">
                                                    <option value="internal">Internal</option>
                                                    <option value="public">Publik</option>
                                                </select>
                                                <input v-model="tab.category" :disabled="!tab.selected" type="text" placeholder="Kategori" class="edu-input text-xs flex-1 py-1">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="mt-6 pt-4 border-t border-slate-200 flex justify-end">
                                    <button @click="saveSettings" :disabled="isActionLoading" class="edu-btn edu-btn-primary"><i class="ph-bold ph-floppy-disk"></i> Simpan Konfigurasi</button>
                                </div>

                    </transition>

            </main>
        </template>
    </div>

    <!-- VUE SCRIPT -->
    <script>
        const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;

        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyy5QjiHpZmQxre8Qh9o84WH0V5TqcTN4xybGke2B8MxFeVInRFZvrhD8lDozOBGmOe/exec'; // MASUKKAN URL WEB APP GAS V21 ANDA DI SINI

        createApp({
            setup() {
                const isGlobalLoading = ref(true);
                const isActionLoading = ref(false);
                const isMobileMenuOpen = ref(false);
                
                const toast = ref({ show: false, message: '', type: 'success' });
                let toastTimer;
                const showToast = (msg, type = 'success') => {
                    toast.value = { show: true, message: msg, type: type };
                    clearTimeout(toastTimer);
                    toastTimer = setTimeout(() => { toast.value.show = false; }, 3000);
                };

                const fetchGasApi = async (action, payload = {}) => {
                    if (!GAS_API_URL) throw new Error("GAS_API_URL belum dikonfigurasi.");
                    const response = await fetch(GAS_API_URL, {
                        method: 'POST', redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action, payload })
                    });
                    return await response.json();
                };
                
                const currentUser = ref(null);
                const route = ref('home');
                
                const appConfig = ref({ appName: 'Edu-Portal', appLogo: '', appHeaderText: '' });
                const sources = ref([]); 
                const articlesRaw = ref([]);
                
                // Parse metadata string into object for frontend usage
                const articles = computed(() => articlesRaw.value.map(a => {
                    let parsedMeta = {};
                    try { if(a.metaData) parsedMeta = JSON.parse(a.metaData); } catch(e) {}
                    return { ...a, metaDataObj: parsedMeta };
                }));

                const activeArticle = ref(null);
                const loginForm = ref({ username: '', password: '' });
                
                // CMS Editor State (Moved from Modal to Full Page)
                const cmsForm = ref({ type: 'berita', galleryUrls: [] });
                const editorMeta = ref({});
                const cmsFilterType = ref('All');
                
                const settingsForm = ref({ sources: [] });
                const newSourceUrl = ref('');

                // Viewer State (With Search Debounce)
                const viewerForm = ref({ sourceString: '', searchRaw: '', search: '', sortCol: null, sortDir: 'asc', page: 1 });
                const viewerState = ref({ loading: false, headers: [], rows: [] });
                
                let searchTimeout;
                const debounceSearch = () => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => { viewerForm.value.search = viewerForm.value.searchRaw; }, 300);
                };

                const parseHash = () => {
                    const hash = window.location.hash.slice(1) || 'home';
                    const [path, qs] = hash.split('?');
                    
                    if (['dashboard', 'cms', 'cms-editor', 'settings'].includes(path) && !currentUser.value) { window.location.hash = '#login'; return; }
                    if (path === 'settings' && currentUser.value?.role !== 'admin') { window.location.hash = '#dashboard'; return; }

                    route.value = path || 'home';
                    const params = new URLSearchParams(qs);
                    
                    if (path === 'article') {
                        const id = params.get('id'); activeArticle.value = articles.value.find(a => a.id === id) || null;
                    } else if (path === 'viewer') {
                        const src = params.get('src'); const tab = params.get('tab');
                        if (src && tab) { 
                            const str = src + '|||' + tab;
                            if(viewerForm.value.sourceString !== str) {
                                viewerForm.value.sourceString = str;
                                doFetchSheetData(src, tab);
                            }
                        }
                    } else if (path === 'settings') {
                        settingsForm.value.sources = JSON.parse(JSON.stringify(sources.value || []));
                    } else if (path === 'cms-editor' && !cmsForm.value.id && !cmsForm.value.type) {
                        openEditor(null); // Initialize if accessed directly
                    }
                    
                    const scroller = document.getElementById('main-scroller');
                    if(scroller) scroller.scrollTop = 0;
                };

                window.addEventListener('hashchange', parseHash);
                const navigate = (path, params = {}) => {
                    const paramsStr = new URLSearchParams(params).toString();
                    window.location.hash = `#${path}${paramsStr ? '?' + paramsStr : ''}`;
                };

                const loadGlobalData = () => {
                    const role = currentUser.value ? currentUser.value.role : null;
                    isGlobalLoading.value = true;
                    if (GAS_API_URL) {
                        fetchGasApi('getInitialPayload', { role }).then(res => {
                            isGlobalLoading.value = false;
                            if(res && res.success) {
                                appConfig.value = res.config || appConfig.value;
                                sources.value = res.sources || []; 
                                articlesRaw.value = res.articles || [];
                                parseHash();
                            }
                        }).catch(err => { isGlobalLoading.value = false; showToast("Gagal muat data.", "error"); });
                    } else {
                        setTimeout(() => { isGlobalLoading.value = false; parseHash(); }, 1000); 
                    }
                };

                onMounted(() => loadGlobalData());

                const handleLogin = () => {
                    isActionLoading.value = true;
                    if (GAS_API_URL) {
                        fetchGasApi('loginUser', loginForm.value).then(res => {
                            isActionLoading.value = false;
                            if(res.success) { currentUser.value = res.user; navigate('dashboard'); loadGlobalData(); showToast('Login Berhasil'); } 
                            else showToast(res.error, 'error');
                        }).catch(e => { isActionLoading.value = false; showToast('Koneksi Gagal', 'error'); });
                    } else {
                        setTimeout(() => { isActionLoading.value = false; currentUser.value = {username: 'Admin', role: 'admin'}; navigate('dashboard'); }, 500);
                    }
                };
                const handleLogout = () => { currentUser.value = null; navigate('home'); loadGlobalData(); };

                // COMPUTED PROPERTIES UNTUK EDU-PORTAL
                const identitasLembaga = computed(() => {
                    const item = articles.value.find(a => a.type === 'identitas_lembaga');
                    return item ? { nama: item.title, logo: item.imageUrl, npsn: item.metaDataObj?.npsn, alamat: item.metaDataObj?.alamat, maps: item.embedCode } : appConfig.value;
                });
                const kepsekData = computed(() => articles.value.find(a => a.type === 'kepala_sekolah') || {});
                const beritaItems = computed(() => articles.value.filter(a => a.type === 'berita'));
                const agendaItems = computed(() => articles.value.filter(a => a.type === 'agenda'));
                const guruItems = computed(() => articles.value.filter(a => a.type === 'guru_staff'));
                const fasilitasItems = computed(() => articles.value.filter(a => a.type === 'fasilitas'));

                const filteredCmsArticles = computed(() => {
                    if(cmsFilterType.value === 'All') return articles.value;
                    return articles.value.filter(a => a.type === cmsFilterType.value);
                });

                let quillInstance = null;
                const setDefaultEditorMeta = () => {
                    if(!cmsForm.value.id) editorMeta.value = {}; // Reset meta if changing type on new post
                };

                const openEditor = (article = null) => {
                    if (article) {
                        editorMeta.value = JSON.parse(JSON.stringify(article.metaDataObj || {}));
                        cmsForm.value = { ...article };
                    } else {
                        editorMeta.value = {};
                        cmsForm.value = { id: null, type: 'berita', title: '', content: '', imageUrl: '', category: '', visibility: 'public', author: currentUser.value?.username || 'Admin', date: new Date().toISOString().split('T')[0], tags: '', embedCode: '', redirectUrl: '', galleryUrls: [] };
                    }
                    navigate('cms-editor');
                    
                    nextTick(() => {
                        if(!quillInstance && typeof Quill !== 'undefined' && document.getElementById('quill-editor')) {
                            quillInstance = new Quill('#quill-editor', {
                                theme: 'snow', placeholder: 'Tuliskan isi detail di sini...',
                                modules: { toolbar: [ [{ 'header': [1, 2, 3, false] }], ['bold', 'italic', 'underline'], [{'list': 'ordered'}, {'list': 'bullet'}], ['link', 'image'], ['clean'] ] }
                            });
                            quillInstance.on('text-change', () => { cmsForm.value.content = quillInstance.root.innerHTML; });
                        }
                        if(quillInstance) quillInstance.root.innerHTML = cmsForm.value.content || '';
                    });
                };

                const saveCmsArticle = () => {
                    isActionLoading.value = true;
                    if(quillInstance && cmsForm.value.type !== 'Galeri') cmsForm.value.content = quillInstance.root.innerHTML;
                    
                    const payloadData = JSON.parse(JSON.stringify(cmsForm.value));
                    payloadData.metaData = JSON.stringify(editorMeta.value); // Serialize meta
                    
                    if(GAS_API_URL) {
                        fetchGasApi('saveArticle', { payloadData }).then(res => {
                            isActionLoading.value = false;
                            if(res.success) { navigate('cms'); loadGlobalData(); showToast('Tersimpan!'); }
                            else showToast(res.error, 'error');
                        }).catch(e => { isActionLoading.value = false; showToast('Gagal Simpan', 'error'); });
                    } else {
                        setTimeout(() => { isActionLoading.value = false; navigate('cms'); showToast('Tersimpan (Mock)'); }, 500);
                    }
                };

                const deleteArticle = (id) => {
                    if(confirm("Hapus data ini?") && GAS_API_URL) {
                        fetchGasApi('deleteArticle', { id }).then(res => { if(res.success) loadGlobalData(); });
                    }
                };

                // VIEWER LOGIC
                const doFetchSheetData = (srcId, tabName) => {
                    viewerState.value.loading = true; viewerForm.value.searchRaw = ''; viewerForm.value.search = ''; viewerForm.value.page = 1;
                    if (GAS_API_URL) {
                        fetchGasApi('getSheetData', { srcId, tabName }).then(res => {
                            viewerState.value.loading = false;
                            if(res.success) { viewerState.value.headers = res.headers||[]; viewerState.value.rows = res.rows||[]; }
                        }).catch(e => viewerState.value.loading = false);
                    }
                };
                const handleViewerDropdownChange = () => {
                    const parts = viewerForm.value.sourceString.split('|||');
                    if(parts.length === 2) { navigate('viewer', {src: parts[0], tab: parts[1]}); doFetchSheetData(parts[0], parts[1]); }
                };

                const viewerFiltered = computed(() => {
                    let result = viewerState.value.rows || [];
                    const q = viewerForm.value.search.toLowerCase();
                    if (q) result = result.filter(r => r.some(c => String(c).toLowerCase().includes(q)));
                    if (viewerForm.value.sortCol !== null) {
                        const col = viewerForm.value.sortCol; const dir = viewerForm.value.sortDir;
                        result = result.slice().sort((a,b) => dir==='asc'? String(a[col]).localeCompare(String(b[col])) : String(b[col]).localeCompare(String(a[col])));
                    }
                    return result;
                });
                const viewerPaginated = computed(() => { const start = (viewerForm.value.page - 1) * 50; return viewerFiltered.value.slice(start, start + 50); });
                const viewerTotalPages = computed(() => Math.ceil(viewerFiltered.value.length / 50));
                watch(() => viewerForm.value.search, () => viewerForm.value.page = 1);
                const viewerSort = (i) => { if(viewerForm.value.sortCol===i) viewerForm.value.sortDir=viewerForm.value.sortDir==='asc'?'desc':'asc'; else{ viewerForm.value.sortCol=i; viewerForm.value.sortDir='asc'; }};

                const openArticle = (id) => navigate('article', {id});
                
                const getParsedGallery = (item) => { try { return Array.isArray(JSON.parse(item.galleryUrls)) ? JSON.parse(item.galleryUrls) : []; } catch(e) { return []; } };
                const getGalleryCover = (item) => getParsedGallery(item)[0] || item.imageUrl || '';

                return {
                    isGlobalLoading, isActionLoading, isMobileMenuOpen, currentUser, route, navigate, toast,
                    articles, identitasLembaga, kepsekData, beritaItems, agendaItems, guruItems, fasilitasItems,
                    filteredCmsArticles, cmsFilterType, cmsForm, editorMeta, openEditor, setDefaultEditorMeta, saveCmsArticle, deleteArticle, openArticle, getParsedGallery, getGalleryCover,
                    loginForm, handleLogin, handleLogout,
                    sources, viewerForm, viewerState, viewerPaginated, viewerFiltered, viewerTotalPages, viewerSort, debounceSearch, handleViewerDropdownChange,
                    settingsForm, newSourceUrl, saveSettings: () => { /* Logic simpan setting sama spt V20 */ }
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
